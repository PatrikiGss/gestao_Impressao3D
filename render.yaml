# Blueprint do Render: descreve o serviço web.
# No painel: New > Blueprint, aponte para o repositório e ele lê este arquivo.
# Serve também de documentação de como o deploy é montado, mesmo para quem
# preferir criar o serviço na mão.
#
# O banco NÃO está aqui: fica no Neon (neon.tech), fora do Render. A
# DATABASE_URL é colada à mão no painel — ver o passo a passo no README.

services:
  - type: web
    name: gestao-impressao3d
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    # O WhiteNoise serve os estáticos dentro do próprio processo, então não é
    # preciso nada além do gunicorn.
    startCommand: "gunicorn Impressora3D.wsgi:application"
    healthCheckPath: /

    envVars:
      # sync: false = o Render pergunta o valor na criação e nunca sobrescreve.
      # Cole aqui a connection string do Neon (a do endpoint com -pooler).
      - key: DATABASE_URL
        sync: false

      # Gerada pelo Render na primeira vez e mantida entre deploys.
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # O domínio .onrender.com é acrescentado automaticamente pelo settings,
      # via RENDER_EXTERNAL_HOSTNAME. Esta lista é só para domínio próprio.
      - key: ALLOWED_HOSTS
        sync: false

      - key: PYTHON_VERSION
        value: "3.12.7"

      # Só faz sentido com o plano pago, que tem disco persistente.
      # Ver "Arquivos enviados" no README antes de habilitar.
      # - key: MEDIA_ROOT
      #   value: /var/data/media
